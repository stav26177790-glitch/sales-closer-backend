# Прогон набора ситуаций на настоящей модели (tests/eval) — по кнопке.
# GitHub → Actions → «Прогон набора ситуаций» → Run workflow.
# Нужен секрет репозитория с ключом провайдера (Settings → Secrets and variables → Actions):
#   DEEPSEEK_API_KEY (провайдер deepseek) или ANTHROPIC_API_KEY (anthropic).
# Стоит денег: все 16 ситуаций с судьёй — DeepSeek ≈ $10–20, Claude ≈ $35–45.
name: Прогон набора ситуаций

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Номера ситуаций через запятую (пусто — все 16)'
        required: false
        default: ''
      concurrency:
        description: 'Сколько ситуаций параллельно'
        required: false
        default: '2'
      judge:
        description: 'Оценка судьёй (true/false)'
        required: false
        default: 'true'
      provider:
        description: 'Провайдер моделей: deepseek или anthropic'
        required: false
        default: 'deepseek'

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Зависимости
        run: npm ci || npm install
      - name: Прогон
        env:
          LLM_PROVIDER: ${{ inputs.provider }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS="--concurrency ${{ inputs.concurrency }}"
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          if [ "${{ inputs.judge }}" = "false" ]; then ARGS="$ARGS --no-judge"; fi
          node tests/eval/run.js $ARGS
      # Отчёт — ещё и в ветку eval-reports (её читает Claude: файлы-артефакты из его окружения недоступны).
      # Render выкладывает только main — на работу Клоузера это не влияет.
      - name: Отчёт в ветку eval-reports
        if: always()
        run: |
          [ -d eval-report ] || exit 0
          DIR="runs/$(date -u +%Y-%m-%d_%H%M)_${{ inputs.provider }}_${{ github.run_id }}"
          git config user.name "eval-bot"; git config user.email "eval-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin eval-reports >/dev/null; then
            git fetch --depth 1 origin eval-reports && git worktree add -B eval-reports /tmp/rep FETCH_HEAD
          else
            git worktree add --orphan -b eval-reports /tmp/rep
          fi
          mkdir -p "/tmp/rep/$DIR" && cp -r eval-report/. "/tmp/rep/$DIR/"
          cd /tmp/rep && git add -A && git commit -qm "eval $DIR" && git push -q origin eval-reports
      - name: Отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report/
          if-no-files-found: warn
