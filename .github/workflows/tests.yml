# Тесты Клоузера на каждый пуш и pull request.
# Внешние сервисы не нужны: база и агенты замоканы, ключи не требуются.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        run: npm test
